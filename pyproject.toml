[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rowhammer-dram-mitigation-engine"
version = "2.0.1"
description = "Illustrative rowhammer indicator classification and DRAM mitigation review tooling"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
dependencies = ["pydantic>=2.5,<3", "fastapi>=0.110,<1", "uvicorn>=0.25,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2"]

[project.scripts]
rowhammer-dram-mitigation-engine = "rowhammer_mitigation.cli:main"
rowhammer-agent = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/rowhammer-dram-mitigation-agent"
Repository = "https://github.com/abusuraihsakhri/rowhammer-dram-mitigation-agent"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "rowhammer_mitigation_app"]

[tool.setuptools.packages.find]
include = ["agents*", "rowhammer_mitigation*"]
