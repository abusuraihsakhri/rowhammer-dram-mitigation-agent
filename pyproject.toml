[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rowhammer-dram-mitigation-engine"
version = "2.0.0"
description = "Rowhammer DRAM Bit-Flip Vulnerability & TRR Mitigation Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
rowhammer-dram-mitigation-engine = "rowhammer_mitigation.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/rowhammer-dram-mitigation-engine"
Repository = "https://github.com/abusuraihsakhri/rowhammer-dram-mitigation-engine.git"
