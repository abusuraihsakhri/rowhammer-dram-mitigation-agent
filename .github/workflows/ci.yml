name: Tests and static verification

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Python compile and tests
        env:
          AUDIT_SECRET_KEY: ci-test-only-signing-key-do-not-use-in-production
        run: |
          python -m compileall -q agents rowhammer_mitigation cli.py simulator.py
          python -m pytest -q
      - name: Browser script syntax and deterministic tests
        run: |
          node --check web/app.js
          node --test tests/test_frontend.cjs
      - name: Verify Python distribution builds
        run: python -m build
